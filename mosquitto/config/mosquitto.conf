# Eclipse Mosquitto - MQTT broker for the virtual vehicle fleet
# (vehicles are SOFTWARE-SIMULATED; the broker, protocol and security are real)

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false

# ---- Authentication & authorisation -------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ---- Throughput tuning for load tests -------------------------------------
max_inflight_messages 1000
max_queued_messages 100000
max_connections -1
sys_interval 10
# disable Nagle: without this, small MQTT frames to subscribers wait for delayed ACKs (~40 ms)
set_tcp_nodelay true

# ---- Plain MQTT (inside the docker network / localhost demo) --------------
listener 1883
protocol mqtt

# ---- MQTT over TLS (enable after running scripts/gen-certs.sh) ------------
# listener 8883
# protocol mqtt
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# require_certificate true          # mutual TLS: every client needs a cert signed by the CA
# use_identity_as_username true
