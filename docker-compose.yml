# =====================================================================
# AV Fleet - end-to-end SOFTWARE simulation of an autonomous-vehicle fleet
#   Virtual vehicles -> MQTT -> Node-RED -> Kafka -> microservices
#   -> MongoDB / Redis -> Backend API -> Web dashboard   (+ Prometheus/Grafana)
# No physical vehicles, sensors, Arduino or Raspberry Pi are required.
# =====================================================================
name: av-fleet

x-service-env: &service-env
  KAFKA_BROKER: ${KAFKA_BROKER}
  KAFKA_TOPIC_TELEMETRY: ${KAFKA_TOPIC_TELEMETRY}
  KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS}
  KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS}
  MONGODB_URI: ${MONGODB_URI}
  MONGODB_DB: ${MONGODB_DB}
  REDIS_URI: ${REDIS_URI}
  LOW_BATTERY_THRESHOLD: ${LOW_BATTERY_THRESHOLD}
  CRITICAL_BATTERY_THRESHOLD: ${CRITICAL_BATTERY_THRESHOLD}
  TELEMETRY_TTL_DAYS: ${TELEMETRY_TTL_DAYS}
  LOG_LEVEL: ${LOG_LEVEL}
  TELEMETRY_INTERVAL: ${TELEMETRY_INTERVAL:-1}
  ACTIVE_WINDOW_S: ${ACTIVE_WINDOW_S:-}

services:
  # ------------------------------------------------------------ messaging
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u ${MQTT_NODERED_USERNAME} -P ${MQTT_NODERED_PASSWORD} -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
      CLUSTER_ID: "av-fleet-kraft-cluster-01"
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        K=/opt/kafka/bin/kafka-topics.sh; B=kafka:9092
        $$K --bootstrap-server $$B --create --if-not-exists --topic ${KAFKA_TOPIC_TELEMETRY} --partitions ${KAFKA_TELEMETRY_PARTITIONS} --replication-factor 1 --config retention.ms=86400000
        $$K --bootstrap-server $$B --create --if-not-exists --topic ${KAFKA_TOPIC_EVENTS} --partitions 3 --replication-factor 1 --config retention.ms=604800000
        $$K --bootstrap-server $$B --create --if-not-exists --topic ${KAFKA_TOPIC_ALERTS} --partitions 3 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic ${KAFKA_TOPIC_DLQ} --partitions 1 --replication-factor 1 --config retention.ms=604800000
        $$K --bootstrap-server $$B --list
    restart: "no"

  nodered:
    build: ./nodered
    ports: ["1880:1880"]
    environment:
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_USERNAME: ${MQTT_NODERED_USERNAME}
      MQTT_PASSWORD: ${MQTT_NODERED_PASSWORD}
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_TOPIC_TELEMETRY: ${KAFKA_TOPIC_TELEMETRY}
      KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS}
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ}
      KAFKA_ENABLED: "true"
      NODE_OPTIONS: "--max-old-space-size=768"
    depends_on:
      mosquitto: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # ------------------------------------------------------------ storage
  mongodb:
    image: mongo:7.0
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    command: ["--wiredTigerCacheSizeGB", "1"]
    volumes:
      - mongo-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------ microservices
  telemetry-service:
    build: ./services
    command: ["python", "-m", "telemetry_service.main"]
    environment: { <<: *service-env, SERVICE_HTTP_PORT: "8001" }
    ports: ["8001:8001"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  alert-service:
    build: ./services
    command: ["python", "-m", "alert_service.main"]
    environment: { <<: *service-env, SERVICE_HTTP_PORT: "8002" }
    ports: ["8002:8002"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  analytics-service:
    build: ./services
    command: ["python", "-m", "analytics_service.main"]
    environment: { <<: *service-env, SERVICE_HTTP_PORT: "8003" }
    ports: ["8003:8003"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8000:8000"]
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB: ${MONGODB_DB}
      REDIS_URI: ${REDIS_URI}
      JWT_SECRET: ${JWT_SECRET}
      API_USERS: ${API_USERS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SIMULATOR_URL: http://simulator:9105
      NODERED_URL: http://nodered:1880
      LOG_LEVEL: ${LOG_LEVEL}
      TELEMETRY_INTERVAL: ${TELEMETRY_INTERVAL:-1}
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # ------------------------------------------------------------ virtual fleet
  simulator:
    build: ./simulator
    ports: ["9105:9105"]
    environment:
      MODE: ${MODE}
      VEHICLE_COUNT: ${VEHICLE_COUNT}
      TELEMETRY_INTERVAL: ${TELEMETRY_INTERVAL}
      EMERGENCY_EVENT_RATE: ${EMERGENCY_EVENT_RATE}
      LOW_BATTERY_THRESHOLD: ${LOW_BATTERY_THRESHOLD}
      CRITICAL_BATTERY_THRESHOLD: ${CRITICAL_BATTERY_THRESHOLD}
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_USERNAME: ${MQTT_SIM_USERNAME}
      MQTT_PASSWORD: ${MQTT_SIM_PASSWORD}
      MQTT_CONNECTION_MODE: ${MQTT_CONNECTION_MODE}
      VEHICLES_PER_CONNECTION: ${VEHICLES_PER_CONNECTION}
      FAILURE_RATE: ${FAILURE_RATE}
      DUPLICATE_RATE: ${DUPLICATE_RATE}
      MALFORMED_RATE: ${MALFORMED_RATE}
      RANDOM_SEED: ${RANDOM_SEED}
      KAFKA_BROKER: ${KAFKA_BROKER}
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URI: ${REDIS_URI}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      mosquitto: { condition: service_healthy }
      nodered: { condition: service_started }
    restart: unless-stopped

  # ------------------------------------------------------------ monitoring
  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:9092"]
    depends_on: { kafka: { condition: service_healthy } }
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on: [redis]
    restart: unless-stopped

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    command: ["--mongodb.uri=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/admin", "--collect-all", "--compatible-mode"]
    depends_on: { mongodb: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  mosquitto-data:
  kafka-data:
  mongo-data:
  redis-data:
  prometheus-data:
